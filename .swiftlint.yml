# .swiftlint.yml — Keyboat
# Full SwiftLint configuration. Keeps code consistent and catches anti-patterns.

disabled_rules:
  - trailing_whitespace    # Xcode auto-strips
  - todo                   # TODOs are acceptable during active dev

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - nslocalizedstring_key
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - single_test_class
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_between_cases

included:
  - KeyboatApp
  - KeyboatExtension
  - Packages/KeyboatCore

excluded:
  - "**/.build"
  - "**/DerivedData"
  - "**/Pods"

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 400
  error: 600

cyclomatic_complexity:
  warning: 15
  error: 25

force_unwrapping:
  severity: warning

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
  allowed_symbols: ["_"]
  validates_start_with_lowercase: true

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 4

reporter: "xcode"
